name: watchdog

# Checks the result, not the machinery. The release pipeline can stop in ways
# that leave no red run: a cron GitHub never fires, a schedule it switches off
# after sixty quiet days, a run that succeeds while publishing nothing. So this
# asks whether the newest release is missing something upstream (or this
# repository's own build recipe) has had for more than a day, and says so.
#
# The same goes for the daily keyring-watch, which says when upstream changes the
# keys that sign Podman: a cron that stops firing says nothing, so the second job
# asks whether it has run in the last two days.
#
# Events. The schedule, twice a day, is what reads the answer: on it a failure opens
# an issue, which GitHub turns into a notification. A push to main that changes this
# file or scripts/monitoring/ asks once more, which is how an edit to either is
# exercised the moment it merges; any other push would ask a question its change
# cannot have altered, and nobody reads a failed run on a push. A dispatch asks on
# demand. Not a pull request:
# both jobs only read the state of upstream, of the releases and of the runs, so
# the answer is the same whatever the pull request holds, it cannot change it, and
# each run costs the network calls of the jobs below (nine ls-remote and gh calls,
# one of them a download, for delivery lag; one gh call for the freshness of the
# keyring watch) on every push to every pull request, with a failure that is not
# that pull request's. What the scripts decide is tested, with fixtures, by tests/monitoring/,
# and the steps that run them by watchdog-delivery-lag.test.sh and
# watchdog-keyring-freshness.test.sh, which do run on a pull request.
# A rule in workflow-policy.test.sh keeps the trigger off.
#
# Nothing here is cancelled: a run on a schedule or a push is never superseded, and
# there is no pull request run left to supersede. None of it is a required check: it
# fails because something happened elsewhere, and requiring it would block the repair.

on:
  schedule:
    - cron: "43 8,20 * * *"
  push:
    branches: ["main"]
    paths:
      - .github/workflows/watchdog.yml
      - scripts/monitoring/**
  workflow_dispatch:

permissions: {}

jobs:
  delivery-lag:
    name: delivery lag
    # ubuntu-latest resolved to ubuntu-26.04 in this repository's runs on 2026-11-20,
    # and ubuntu-24.04-arm to 24.04. The label is named so a change of image is a
    # commit; the arm64 build keeps its own label, so the rootless test covers both.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Measured in this repository's runs: 8 to 10 seconds, nine calls to GitHub.
    # The ten minutes is a ceiling for a slow network, not a measurement.
    timeout-minutes: 10
    outputs:
      code: ${{ steps.lag.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Is the newest release missing something that has waited too long
        id: lag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_HOURS: "24"
        run: |
          w="$RUNNER_TEMP/lag"; mkdir -p "$w"
          for c in podman netavark aardvark-dns; do
            tag="$(bash scripts/upstream/latest-stable.sh "https://github.com/containers/$c.git")"
            echo "$c $tag" >> "$w/fresh"
            # When upstream published it. A tag with no GitHub release has no
            # date, so it counts as appearing now rather than raising a false alarm.
            when="$(gh release view "$tag" --repo "containers/$c" --json publishedAt --jq .publishedAt 2>/dev/null || true)"
            epoch="$(date -d "${when:-now}" +%s)"
            echo "$c $tag $epoch" >> "$w/dates"
          done
          recipe="$(bash scripts/build/recipe-id.sh)"
          echo "recipe $recipe" >> "$w/fresh"
          echo "recipe $recipe $(git log -1 --format=%ct -- scripts/build)" >> "$w/dates"
          git ls-remote --tags "https://github.com/$GH_REPO.git" \
            | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u > "$w/tags"
          bash scripts/upstream/read-released.sh "$w/released"
          # 1 means it is behind for too long; 2 means it could not tell, and the
          # alert says which, because they call for different things.
          set +e
          bash scripts/monitoring/delivery-lag.sh "$w/fresh" "$w/released" "$w/tags" "$w/dates" "$(date +%s)" "$MAX_HOURS"
          rc=$?
          set -e
          echo "code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

  alert:
    name: alert
    needs: delivery-lag
    if: ${{ failure() && github.event_name == 'schedule' }}
    # Only calls gh or reads strings: nothing here depends on the image.
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Ceiling, not measured: two gh calls.
    timeout-minutes: 5
    steps:
      - name: Open an issue, or add to the one that is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE: ${{ needs.delivery-lag.outputs.code }}
        run: |
          if [ "$CODE" = "2" ]; then
            title="The release pipeline's delivery check could not decide"
            body="The delivery check could not tell whether the newest release is behind upstream: it could not read what the release carries, or an upstream date. Read the run: $RUN_URL"
          else
            title="Release pipeline is behind upstream"
            body="The newest release is missing something upstream, or this repository's build recipe, has had for more than a day. Run: $RUN_URL"
          fi
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --label prio:P1 --label area:release --body "$body"
          fi

  # keyring-watch.yml is a cron and nothing else. If it stops firing, nothing in
  # this repository notices, and the first sign is a release refused because
  # upstream changed a key and the copy here did not follow. It fires once a day,
  # so two days without a finished scheduled run is a miss GitHub's usual lateness
  # does not explain.
  keyring-watch-freshness:
    name: keyring watch freshness
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      issues: write
    # Ceiling, not measured: one gh call and a script that reads its answer.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Has the keyring watch run in the last two days
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_HOURS: "48"
        run: |
          runs="$RUNNER_TEMP/keyring-watch-runs.json"
          if ! gh run list --workflow keyring-watch.yml --event schedule --limit 20 \
            --json createdAt,conclusion > "$runs"; then
            echo "code=2" >> "$GITHUB_OUTPUT"
            echo "::error::could not list the runs of keyring-watch.yml"
            exit 2
          fi
          # 1 means it has not run for too long; 2 means it could not tell.
          set +e
          bash scripts/monitoring/schedule-freshness.sh "$runs" "$(date +%s)" "$MAX_HOURS"
          rc=$?
          set -e
          echo "code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Open an issue, or add to the one that is open
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE: ${{ steps.fresh.outputs.code }}
        run: |
          if [ "$CODE" = "1" ]; then
            title="The keyring watch has stopped running"
            body="keyring-watch.yml has not finished a scheduled run in the last two days, so a change to the keys that sign Podman would go unnoticed until a release is refused. Check that the workflow is enabled and that scheduled workflows are running in this repository. Run: $RUN_URL"
          else
            title="The keyring watch's freshness check could not decide"
            body="The check that keyring-watch.yml still runs could not read its runs or a date in them. Read the run: $RUN_URL"
          fi
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --label prio:P1 --label area:upstream --body "$body"
          fi
