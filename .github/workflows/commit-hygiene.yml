name: commit hygiene

# Two things history cannot take back, checked before a pull request merges: a
# personal email address in a commit, and something shaped like a credential in
# the lines it adds. Shell only, no third-party tooling, so neither job needs a
# secret or a network.
#
# The dco check only asks for "a name and an address" and passed thirty-four
# commits signed off with a personal one; GitHub's push protection knows the
# formats of other people's tokens, not a signing key of our own.

on:
  pull_request:
    branches: ["main"]

permissions: {}

# Both jobs read the pull request's head commit and nothing else, so a newer push
# makes the earlier run answer about a commit that no longer exists. It is cancelled.
# There is no other event here, and nothing to merge or publish, so nothing is left
# half done by the cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every run step goes through `bash -e -o pipefail`, which is what `shell: bash` means to Actions. Without it
# the shell is `bash -e` alone, and a pipeline hides the failure of all but its last command.
defaults:
  run:
    shell: bash

jobs:
  commit-identity:
    name: commit identity
    # ubuntu-latest resolved to ubuntu-26.04 in this repository's runs on 2026-11-20,
    # and ubuntu-24.04-arm to 24.04. The label is named so a change of image is a
    # commit; the arm64 build keeps its own label, so the rootless test covers both.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Ceiling, not measured: a checkout of the history and a loop over its commits.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit uses a GitHub noreply address
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The script that judges the change is the one on the base branch: the
          # checkout is the pull request's own tree, and a change that rewrote the
          # check would be the one deciding whether it passes. The copy of the tree
          # is used only when the base has none, the commit that introduces it.
          tool=scripts/quality/check-commit-identity
          if git cat-file -e "$BASE:$tool.sh" 2>/dev/null; then
            git show "$BASE:$tool.sh" > "$RUNNER_TEMP/check-commit-identity.sh"
          else
            cp "$tool.sh" "$RUNNER_TEMP/check-commit-identity.sh"
          fi
          bash "$RUNNER_TEMP/check-commit-identity.sh" "$BASE" "$HEAD"

  secret-scan:
    name: secret scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Ceiling, not measured: a checkout of the history and a scan of the added lines.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The change adds no credential-shaped line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The scanner is the one on the base branch, for the reason the identity
          # check is: the pull request's tree must not be able to change what judges it.
          tool=scripts/quality/check-secrets
          if git cat-file -e "$BASE:$tool.sh" 2>/dev/null; then
            git show "$BASE:$tool.sh" > "$RUNNER_TEMP/check-secrets.sh"
          else
            cp "$tool.sh" "$RUNNER_TEMP/check-secrets.sh"
          fi
          bash "$RUNNER_TEMP/check-secrets.sh" "$BASE" "$HEAD"
