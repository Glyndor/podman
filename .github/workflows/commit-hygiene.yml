name: commit hygiene

# Two things history cannot take back, checked before a pull request merges: a
# personal email address in a commit, and something shaped like a credential in
# the lines it adds. Shell only, no third-party tooling, so neither job needs a
# secret or a network.
#
# The dco check only asks for "a name and an address" and passed thirty-four
# commits signed off with a personal one; GitHub's push protection knows the
# formats of other people's tokens, not a signing key of our own.

on:
  pull_request:
    branches: ["main"]

permissions: {}

# Both jobs read the pull request's head commit and nothing else, so a newer push
# makes the earlier run answer about a commit that no longer exists. It is cancelled.
# There is no other event here, and nothing to merge or publish, so nothing is left
# half done by the cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-identity:
    name: commit identity
    # ubuntu-latest resolved to ubuntu-26.04 in this repository's runs on 2026-11-20,
    # and ubuntu-24.04-arm to 24.04. The label is named so a change of image is a
    # commit; the arm64 build keeps its own label, so the rootless test covers both.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit uses a GitHub noreply address
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/quality/check-commit-identity.sh "$BASE" "$HEAD"

  secret-scan:
    name: secret scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The change adds no credential-shaped line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/quality/check-secrets.sh "$BASE" "$HEAD"
