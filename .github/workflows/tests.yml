name: tests

on:
  pull_request:
    branches: ["main"]

permissions: {}

# The workflow runs on a pull request and on nothing else. A newer push to that
# pull request makes the run for the older commit pointless, so it is cancelled.
# A merge is judged by the pull request that produced it, so no run happens again
# on main: the same tree would be run twice for one change.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every run step goes through `bash -e -o pipefail`, which is what `shell: bash` means to Actions. Without it
# the shell is `bash -e` alone, and a pipeline hides the failure of all but its last command.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test
    # ubuntu-latest resolved to ubuntu-26.04 in this repository's runs on 2026-11-20,
    # and ubuntu-24.04-arm to 24.04. The label is named so a change of image is a
    # commit; the arm64 build keeps its own label, so the rootless test covers both.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Measured in this repository's runs: 11 to 13 seconds for the job. The fifteen
    # minutes is a ceiling, not a measurement.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because the step that decides which suites this
          # change can affect reads the resolver and the map of the BASE commit:
          # HEAD^1 of the merge commit GitHub builds is the base, and a clone of
          # one commit does not have it. A checkout too shallow to hold the base
          # decides nothing and runs every suite.
          fetch-depth: 0
          persist-credentials: false
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          # Pinned by tag and checked against the release's sha256 before it is
          # extracted, instead of whatever shellcheck the runner image ships: two
          # releases disagree about the same code. The version and the hash are
          # the ones reusable-workflow-lint.yml uses, and they move together.
          dir="$RUNNER_TEMP/shellcheck-bin"
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          mkdir -p "$dir"
          curl -sSfL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$tarball" | sha256sum -c -
          tar -xJ -f "$tarball" -C "$dir" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$dir" >> "$GITHUB_PATH"
      - name: shellcheck
        run: |
          shellcheck --version
          # Every script and every suite at any depth, so a folder added under scripts/
          # or tests/ is read without anyone editing this line.
          find scripts tests -name '*.sh' -print0 | xargs -0 shellcheck -S warning
      - name: every script has a test
        run: bash scripts/quality/check-test-coverage.sh
      # A folder past twenty files is split by what each file is for. Counting the
      # tracked files takes a fraction of a second.
      - name: no folder holds more than twenty files
        run: bash scripts/quality/check-folder-size.sh
      # The sweep itself is mutation.yml; this is the second it costs to know that
      # every refusal is in the catalogue the sweep runs, or exempted with a reason.
      - name: every refusal has a mutation entry or an exemption
        run: bash scripts/quality/check-mutation-coverage.sh
      - name: decide which suites this change can affect
        id: scope
        run: |
          set -euo pipefail
          # The suites this change can affect are decided by the resolver and the
          # map of the BASE commit, never as this pull request ships them: a pull
          # request that narrows the map to hide its own suite gets the full set
          # instead. That is the rule for a gate script: a gate script is read
          # from the base commit, never from the checkout of the pull request it
          # is judging.
          #
          # Everything fails open. A diff that cannot be read, a rename, a
          # resolver that cannot be read from the base commit, a map that cannot
          # be parsed: all of them run every suite. A wrong skip lets a change
          # merge untested; a wrong run costs seconds.
          mapfile -t suites < <(find tests -name '*.test.sh' | LC_ALL=C sort)
          total=${#suites[@]}
          resolver="$RUNNER_TEMP/ci-job-scope.sh"
          scope_file="$RUNNER_TEMP/suite-scope.list"
          decision=""
          if git show "HEAD^1:scripts/quality/scope/ci-job-scope.sh" > "$resolver" 2>/dev/null; then
            decision="$(bash "$resolver" suites "${suites[@]}" 2>/dev/null || true)"
          fi
          # A decision is only a decision when every name in it is a suite this
          # job was given. Anything else means the scope could not be
          # established, and an established scope is the only thing that may skip
          # a suite.
          usable=1
          [ -n "$decision" ] || usable=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case " ${suites[*]} " in
              *" $name "*) ;;
              *) usable=0 ;;
            esac
          done <<< "$decision"
          if [ "$usable" = 1 ]; then
            mapfile -t selected <<< "$decision"
          else
            selected=("${suites[@]}")
          fi
          : > "$scope_file"
          for name in "${selected[@]}"; do
            if [ -n "$name" ]; then
              printf '%s\n' "$name" >> "$scope_file"
            fi
          done
          echo "scope: ${#selected[@]} of $total suites can be affected by this change; the rest cannot."
          # The wheel of the ML-DSA-65 suite is installed only when a suite that
          # needs it is among the ones that run. The map of the dependencies is
          # read from the base commit, and a base that does not have it installs
          # the wheel: the decision that could not be established is the one
          # that runs everything, and everything needs the wheel.
          mldsa=true
          deps="$(git show "HEAD^1:scripts/quality/scope/suite-dependencies.txt" 2>/dev/null || true)"
          if [ -n "$deps" ]; then
            mldsa=false
            while IFS= read -r line; do
              case "$line" in '' | \#*) continue ;; esac
              suite="${line%% *}"
              tools="${line#* }"
              case " $tools " in
                *" mldsa-wheel "*) ;;
                *) continue ;;
              esac
              case " ${selected[*]} " in
                *" $suite "*) mldsa=true ;;
              esac
            done <<< "$deps"
          fi
          echo "mldsa=$mldsa" >> "$GITHUB_OUTPUT"
      - name: Install the pinned cryptography wheel for the ML-DSA-65 suite
        # The wheel is only worth installing when a suite that needs it runs.
        if: steps.scope.outputs.mldsa == 'true'
        run: |
          set -euo pipefail
          # The runner's python3-cryptography has no ML-DSA, so the suite that
          # makes and verifies real ML-DSA-65 signatures runs on the wheel
          # release.yml signs with, pinned by hash and binary only, in a virtual
          # environment of its own. The other suites keep the system python3.
          venv="$RUNNER_TEMP/mldsa-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/scripts/release/sign-requirements.txt
      - name: suites
        run: |
          set -euo pipefail
          count=0
          ran=0
          # A suite reads /dev/null: one that read the list on stdin would swallow the
          # name of the next suite, which would then never run while the job passed.
          # Every file named *.test.sh under tests/, at any depth: a suite in a new
          # subfolder runs without anyone editing this step, and one that is named
          # otherwise is refused by tests/workflows/policy/tests-run-every-suite.test.sh.
          # A suite that fails ends the step, and the job with it: what is behind a
          # failure is a verdict nobody needs, and the cheap suites go first. The step
          # ends with the failure, as the shell of the workflow ends with it.
          #
          # A suite this change cannot affect does not run: the step above wrote
          # the ones it can into a file, and a step that finds no file runs all
          # of them.
          scope_file="$RUNNER_TEMP/suite-scope.list"
          while IFS= read -r t; do
            count=$((count + 1))
            if [ -f "$scope_file" ] && ! grep -qxF -- "$t" "$scope_file"; then
              echo "skip  $t (this change cannot alter its verdict)"
              continue
            fi
            echo "== $t"
            ran=$((ran + 1))
            case "$t" in
              # The environment comes first on PATH for the suite and for the
              # scripts it runs. Without it the suite fails and says what is
              # missing; it is never skipped.
              *-mldsa.test.sh) PATH="$RUNNER_TEMP/mldsa-venv/bin:$PATH" bash "$t" < /dev/null ;;
              *) bash "$t" < /dev/null ;;
            esac
          done < <(find tests -name '*.test.sh' | LC_ALL=C sort)
          echo "$ran suites ran"
          [ "$count" -gt 0 ] || { echo "::error::no suite found under tests/"; exit 1; }
