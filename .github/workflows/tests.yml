name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

# A newer push to a pull request makes the run for the older one pointless, so it
# is cancelled. A push to main is never cancelled: its group is the run id, so
# each one has a group of its own and nothing supersedes it.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every run step goes through `bash -e -o pipefail`, which is what `shell: bash` means to Actions. Without it
# the shell is `bash -e` alone, and a pipeline hides the failure of all but its last command.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test
    # ubuntu-latest resolved to ubuntu-26.04 in this repository's runs on 2026-11-20,
    # and ubuntu-24.04-arm to 24.04. The label is named so a change of image is a
    # commit; the arm64 build keeps its own label, so the rootless test covers both.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Measured in this repository's runs: 11 to 13 seconds for the job. The fifteen
    # minutes is a ceiling, not a measurement.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          # Pinned by tag and checked against the release's sha256 before it is
          # extracted, instead of whatever shellcheck the runner image ships: two
          # releases disagree about the same code. The version and the hash are
          # the ones reusable-workflow-lint.yml uses, and they move together.
          dir="$RUNNER_TEMP/shellcheck-bin"
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          mkdir -p "$dir"
          curl -sSfL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$tarball" | sha256sum -c -
          tar -xJ -f "$tarball" -C "$dir" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$dir" >> "$GITHUB_PATH"
      - name: shellcheck
        run: |
          shellcheck --version
          # Every script and every suite at any depth, so a folder added under scripts/
          # or tests/ is read without anyone editing this line.
          find scripts tests -name '*.sh' -print0 | xargs -0 shellcheck -S warning
      - name: every script has a test
        run: bash scripts/quality/check-test-coverage.sh
      # A folder past twenty files is split by what each file is for. Counting the
      # tracked files takes a fraction of a second.
      - name: no folder holds more than twenty files
        run: bash scripts/quality/check-folder-size.sh
      # The sweep itself is mutation.yml; this is the second it costs to know that
      # every refusal is in the catalogue the sweep runs, or exempted with a reason.
      - name: every refusal has a mutation entry or an exemption
        run: bash scripts/quality/check-mutation-coverage.sh
      - name: Install the pinned cryptography wheel for the ML-DSA-65 suite
        run: |
          set -euo pipefail
          # The runner's python3-cryptography has no ML-DSA, so the suite that
          # makes and verifies real ML-DSA-65 signatures runs on the wheel
          # release.yml signs with, pinned by hash and binary only, in a virtual
          # environment of its own. The other suites keep the system python3.
          venv="$RUNNER_TEMP/mldsa-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/scripts/release/sign-requirements.txt
      - name: suites
        run: |
          status=0
          count=0
          # Every file named *.test.sh under tests/, at any depth: a suite in a new
          # subfolder runs without anyone editing this step, and one that is named
          # otherwise is refused by tests/workflows/policy/tests-run-every-suite.test.sh.
          while IFS= read -r t; do
            echo "== $t"
            count=$((count + 1))
            case "$t" in
              # The environment comes first on PATH for the suite and for the
              # scripts it runs. Without it the suite fails and says what is
              # missing; it is never skipped.
              *-mldsa.test.sh) PATH="$RUNNER_TEMP/mldsa-venv/bin:$PATH" bash "$t" || status=1 ;;
              *) bash "$t" || status=1 ;;
            esac
          done < <(find tests -name '*.test.sh' | LC_ALL=C sort)
          echo "$count suites ran"
          [ "$count" -gt 0 ] || { echo "::error::no suite found under tests/"; exit 1; }
          exit "$status"
