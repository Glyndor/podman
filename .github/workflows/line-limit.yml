name: Line limit

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Every run step goes through `bash -e -o pipefail`, which is what `shell: bash` means to Actions. Without it
# the shell is `bash -e` alone, and a pipeline hides the failure of all but its last command.
defaults:
  run:
    shell: bash

jobs:
  line-limit:
    uses: ./.github/workflows/reusable-line-limit.yml
    with:
      # The reusable's default list has no `txt`, so the lists and the maps the
      # tools read would not be counted: the mutation catalogue, the exemptions
      # and the map that decides which suites a pull request runs. Passed from
      # the caller so this repository's choice stays visible here.
      extensions: "rs go ts tsx js jsx mjs cjs py sh astro vue svelte yml yaml txt"
