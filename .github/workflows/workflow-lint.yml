name: Workflow lint

# Lints this repository's own workflow YAML (actionlint + shellcheck on the
# run: blocks), so a broken caller or a bug in a workflow script fails the PR
# rather than surfacing later. The reusable pins the linters.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Every run step goes through `bash -e -o pipefail`, which is what `shell: bash` means to Actions. Without it
# the shell is `bash -e` alone, and a pipeline hides the failure of all but its last command.
defaults:
  run:
    shell: bash

jobs:
  workflow-lint:
    uses: ./.github/workflows/reusable-workflow-lint.yml
