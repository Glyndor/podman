name: Build, prove and gather the rpm packages (reusable)

# Every rpm of a release: reusable-package.yml for each distribution and architecture of
# scripts/package/distros.txt, and then one job that gathers what they built into the one
# artifact the signer takes. release.yml calls it with upload true, and what it hands forward
# is signed; package-check.yml calls it with upload false on a pull request that changes how
# the packages are built, so the same gathering runs there against real packages.
#
# All or nothing. A leg that fails ends the run: the gathering needs every leg, and it refuses
# unless every leg reported its artifact and the sha256 of each of its packages, the artifact
# of this run with that id is the one reported, and every file is the one hashed. Nothing is
# looked up by a name a later step of a build job could have taken.
#
# The job that gathers runs only the scripts of the repository: no third-party code, no secret
# and nothing from the packages is executed or parsed. It holds contents: read and, to list the
# artifacts of the run, actions: read.

on:
  workflow_call:
    inputs:
      version:
        description: Release version, the tag without the leading v
        type: string
        required: true
      podman:
        description: Upstream Podman tag
        type: string
        required: true
      netavark:
        description: Upstream netavark tag
        type: string
        required: true
      aardvark:
        description: Upstream aardvark-dns tag
        type: string
        required: true
      podman_sha:
        description: Commit the Podman tag pointed at when the plan ran
        type: string
        required: true
      netavark_sha:
        description: Commit the netavark tag pointed at when the plan ran
        type: string
        required: true
      aardvark_sha:
        description: Commit the aardvark-dns tag pointed at when the plan ran
        type: string
        required: true
      upload:
        description: Name the artifacts rpm-, for a release, instead of rpmcheck-
        type: boolean
        required: true
    outputs:
      artifact_id:
        description: Id of the artifact that holds the rpm packages of the release
        value: ${{ jobs.gather.outputs.artifact_id }}
      artifact_digest:
        description: Digest GitHub recorded for that artifact when it was uploaded
        value: ${{ jobs.gather.outputs.artifact_digest }}
      manifest:
        description: sha256 of the sha256 lines of the packages gathered (scripts/release/rpm/collect.sh digest)
        value: ${{ jobs.gather.outputs.manifest }}

permissions: {}

# Every run step goes through `bash -e -o pipefail`, which is what `shell: bash` means to Actions. Without it
# the shell is `bash -e` alone, and a pipeline hides the failure of all but its last command.
defaults:
  run:
    shell: bash

jobs:
  list:
    name: list
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Ceiling, not measured: a checkout and one table read.
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the distributions and architectures to build
        id: m
        run: |
          # The rpm rows of the table, one entry for every distribution and architecture.
          matrix="$(bash scripts/package/distros.sh matrix rpm all)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.id }} ${{ matrix.arch }}
    needs: list
    permissions:
      contents: read
    strategy:
      # The matrix stops at the first row that fails: the runners are few, and a row that passes says it enters while the
      # failure that cuts the run says which does not.
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.list.outputs.matrix) }}
    uses: ./.github/workflows/reusable-package.yml
    with:
      id: ${{ matrix.id }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      version: ${{ inputs.version }}
      podman: ${{ inputs.podman }}
      netavark: ${{ inputs.netavark }}
      aardvark: ${{ inputs.aardvark }}
      podman_sha: ${{ inputs.podman_sha }}
      netavark_sha: ${{ inputs.netavark_sha }}
      aardvark_sha: ${{ inputs.aardvark_sha }}
      upload: ${{ inputs.upload }}

  gather:
    name: gather
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # To list the artifacts of this run, which is what shows each leg's artifact is the one it reported.
      actions: read
    # Ceiling, not measured: a download of every package, their hashes and one upload.
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest: ${{ steps.collect.outputs.manifest }}
    env:
      VERSION: ${{ inputs.version }}
      PREFIX: ${{ inputs.upload && 'rpm' || 'rpmcheck' }}
      # What every leg reported, one output for each: the artifact it uploaded and the hash of every package in it.
      LEGS: ${{ toJSON(needs.package.outputs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the artifact of each leg is the one its build uploaded
        id: legs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # The commit the artifacts of this run are recorded under: the head of a pull request, the event's commit otherwise.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | [.name, (.id | tostring), (.expired | tostring), .workflow_run.head_sha, (.digest // "")] | @tsv' > "$RUNNER_TEMP/artifacts.tsv"
          ids="$(bash scripts/release/rpm/legs.sh "$PREFIX" "$COMMIT" "$LEGS" "$RUNNER_TEMP/artifacts.tsv")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      # One directory for each artifact, named after it, outside the checkout. The download fails when what it unpacked
      # is not the digest recorded for the id.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.legs.outputs.ids }}
          merge-multiple: false
          digest-mismatch: error
          path: ${{ runner.temp }}/legs
      - name: Check each package is the file its build hashed, and gather those of the release
        id: collect
        run: |
          bash scripts/release/rpm/collect.sh gather "$VERSION" "$PREFIX" "$LEGS" "$RUNNER_TEMP/legs" "$RUNNER_TEMP/set"
          manifest="$(bash scripts/release/rpm/collect.sh digest "$VERSION" "$RUNNER_TEMP/set")"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PREFIX }}-set
          path: ${{ runner.temp }}/set/*.rpm
          retention-days: 1
          if-no-files-found: error
