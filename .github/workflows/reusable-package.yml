name: Build and prove a native package (reusable)

# Builds the rpm of one distribution for one architecture from the three verified upstream
# tags, in the container of that distribution, uploads them, and then, in a job of its own
# that downloads that artifact, installs them with the package manager of that distribution
# on a clean image and on one that has the distribution's own Podman, starts containers with
# and without root, and uninstalls them. The artifact is uploaded before anything runs a
# package, so code in one cannot change the bytes the signer will take: it can only change
# what its own job has downloaded. reusable-rpm.yml calls it once for every id of
# scripts/package/distros.txt and every architecture of its row.
#
# Third-party code runs here (a compiler, the distribution's repositories, upstream sources),
# so it holds contents: read and no secrets, and the checkout keeps no credentials. What it
# hands forward is the artifact <prefix>-<id>-<arch> and, as the output <id>_<arch>, one line
# with its id, its digest and the sha256 of each package, taken before anything ran them.
# The outputs of the legs of a matrix are merged by the name of each: a leg sets only its
# own, so every leg of the table has its line below, and a suite holds the two together.

on:
  workflow_call:
    inputs:
      id:
        description: Distribution id, a row of scripts/package/distros.txt
        type: string
        required: true
      arch:
        description: Architecture in the names of the package format, x86_64 or aarch64
        type: string
        required: true
      runner:
        description: Runner label that matches the architecture
        type: string
        required: true
      version:
        description: Release version, the tag without the leading v
        type: string
        required: true
      podman:
        description: Upstream Podman tag
        type: string
        required: true
      netavark:
        description: Upstream netavark tag
        type: string
        required: true
      aardvark:
        description: Upstream aardvark-dns tag
        type: string
        required: true
      podman_sha:
        description: Commit the Podman tag pointed at when the plan ran
        type: string
        required: true
      netavark_sha:
        description: Commit the netavark tag pointed at when the plan ran
        type: string
        required: true
      aardvark_sha:
        description: Commit the aardvark-dns tag pointed at when the plan ran
        type: string
        required: true
      upload:
        description: Name the artifact rpm-<id>-<arch>, for a release, instead of rpmcheck-<id>-<arch>
        type: boolean
        required: true
    outputs:
      fc45_x86_64: { value: "${{ jobs.build.outputs.fc45_x86_64 }}" }
      fc45_aarch64: { value: "${{ jobs.build.outputs.fc45_aarch64 }}" }
      fc44_x86_64: { value: "${{ jobs.build.outputs.fc44_x86_64 }}" }
      fc44_aarch64: { value: "${{ jobs.build.outputs.fc44_aarch64 }}" }
      el10_x86_64: { value: "${{ jobs.build.outputs.el10_x86_64 }}" }
      el10_aarch64: { value: "${{ jobs.build.outputs.el10_aarch64 }}" }
      tumbleweed_x86_64: { value: "${{ jobs.build.outputs.tumbleweed_x86_64 }}" }
      tumbleweed_aarch64: { value: "${{ jobs.build.outputs.tumbleweed_aarch64 }}" }
      el9_x86_64: { value: "${{ jobs.build.outputs.el9_x86_64 }}" }
      el9_aarch64: { value: "${{ jobs.build.outputs.el9_aarch64 }}" }
      amzn2023_x86_64: { value: "${{ jobs.build.outputs.amzn2023_x86_64 }}" }
      amzn2023_aarch64: { value: "${{ jobs.build.outputs.amzn2023_aarch64 }}" }
      leap161_x86_64: { value: "${{ jobs.build.outputs.leap161_x86_64 }}" }
      leap161_aarch64: { value: "${{ jobs.build.outputs.leap161_aarch64 }}" }

permissions: {}

# Every run step goes through `bash -e -o pipefail`, which is what `shell: bash` means to Actions. Without it
# the shell is `bash -e` alone, and a pipeline hides the failure of all but its last command.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ inputs.id }} ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    # What the signer checks the packages against: taken where they were made, before any test ran them.
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      fc45_x86_64: ${{ steps.leg.outputs.fc45_x86_64 }}
      fc45_aarch64: ${{ steps.leg.outputs.fc45_aarch64 }}
      fc44_x86_64: ${{ steps.leg.outputs.fc44_x86_64 }}
      fc44_aarch64: ${{ steps.leg.outputs.fc44_aarch64 }}
      el10_x86_64: ${{ steps.leg.outputs.el10_x86_64 }}
      el10_aarch64: ${{ steps.leg.outputs.el10_aarch64 }}
      tumbleweed_x86_64: ${{ steps.leg.outputs.tumbleweed_x86_64 }}
      tumbleweed_aarch64: ${{ steps.leg.outputs.tumbleweed_aarch64 }}
      el9_x86_64: ${{ steps.leg.outputs.el9_x86_64 }}
      el9_aarch64: ${{ steps.leg.outputs.el9_aarch64 }}
      amzn2023_x86_64: ${{ steps.leg.outputs.amzn2023_x86_64 }}
      amzn2023_aarch64: ${{ steps.leg.outputs.amzn2023_aarch64 }}
      leap161_x86_64: ${{ steps.leg.outputs.leap161_x86_64 }}
      leap161_aarch64: ${{ steps.leg.outputs.leap161_aarch64 }}
    # Ceiling, not measured since the split: a Go build and two Rust builds. The probe of
    # 2026-11-23 built the three components in 5 to 7.5 minutes per distribution; the ceiling is
    # eight times that.
    timeout-minutes: 60
    env:
      ID: ${{ inputs.id }}
      ARCH: ${{ inputs.arch }}
      VERSION: ${{ inputs.version }}
      PODMAN: ${{ inputs.podman }}
      NETAVARK: ${{ inputs.netavark }}
      AARDVARK: ${{ inputs.aardvark }}
      PODMAN_SHA: ${{ inputs.podman_sha }}
      NETAVARK_SHA: ${{ inputs.netavark_sha }}
      AARDVARK_SHA: ${{ inputs.aardvark_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the upstream tags and verify their signatures
        run: |
          fetch() { # <directory> <repository> <tag> <commit the plan resolved>
            git clone --quiet --branch "$3" "https://github.com/containers/$2.git" "$RUNNER_TEMP/$1"
            commit="$(bash scripts/upstream/verify-tag.sh "$RUNNER_TEMP/$1" "$3")"
            [ "$(git -C "$RUNNER_TEMP/$1" rev-parse HEAD)" = "$commit" ]
            # Every distribution and architecture builds the commit the plan saw, so an
            # upstream tag moved in between cannot give them different sources.
            [ "$commit" = "$4" ] || { echo "$2 $3 is at $commit, the plan saw $4" >&2; exit 1; }
            echo "verified $2 $3 at $commit"
          }
          fetch podman podman "$PODMAN" "$PODMAN_SHA"
          fetch netavark netavark "$NETAVARK" "$NETAVARK_SHA"
          fetch aardvark aardvark-dns "$AARDVARK" "$AARDVARK_SHA"
      - name: Fetch the dependencies this distribution takes beside Podman, and verify them
        run: bash scripts/package/rpm/fetch-extras.sh "$ID" "$RUNNER_TEMP/extras"
      - name: Build the package in the container of the distribution
        run: |
          pv="$(bash scripts/package/package-version.sh "$VERSION")"
          mkdir -p "$RUNNER_TEMP/out"
          docker build --quiet --tag "package-$ID" "scripts/package/images/$ID"
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$RUNNER_TEMP/podman:/src/podman" -v "$RUNNER_TEMP/netavark:/src/netavark" \
            -v "$RUNNER_TEMP/aardvark:/src/aardvark" -v "$RUNNER_TEMP/extras:/src/extras:ro" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            -v "$RUNNER_TEMP/out:/out" "package-$ID" \
            bash /scripts/package/rpm/run-build.sh "$ID" "$pv" /out
          ls -l "$RUNNER_TEMP/out"
      # Exactly the packages of this distribution and architecture, hashed before the artifact is made and before
      # anything installs them.
      - name: Check what was built is exactly the packages of the leg, and hash each
        id: hash
        run: |
          files="$(bash scripts/release/rpm/stage-built.sh "$VERSION" "$ID" "$ARCH" "$RUNNER_TEMP/out" "$RUNNER_TEMP/staged")"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      # Before anything runs a package: this is the artifact that is signed, and from here on nothing in this
      # workflow writes to it. The test job downloads it by id; the signer takes it by the id and the digest this
      # step reports, which the job hands on as its output.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.upload && 'rpm' || 'rpmcheck' }}-${{ inputs.id }}-${{ inputs.arch }}
          path: ${{ runner.temp }}/staged/*.rpm
          retention-days: 1
          if-no-files-found: error
      - name: Report the artifact and the hashes of the leg
        id: leg
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          FILES: ${{ steps.hash.outputs.files }}
        run: echo "${ID}_$ARCH=$ARTIFACT_ID $ARTIFACT_DIGEST $FILES" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ inputs.id }} ${{ inputs.arch }}
    needs: build
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    # Ceiling, not measured since the split: the installs and the containers of every image of the row.
    timeout-minutes: 60
    env:
      ID: ${{ inputs.id }}
      ARCH: ${{ inputs.arch }}
      VERSION: ${{ inputs.version }}
      PODMAN: ${{ inputs.podman }}
      # The image the started containers run: Podman's own test image, by digest.
      TEST_IMAGE: quay.io/libpod/alpine@sha256:fa93b01658e3a5a1686dc3ae55f170d8de487006fb53a28efcd12ab0710a2e5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The packages the build job uploaded, by their id: the bytes installed here are the ones hashed before.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/rpms
      - name: Let an unprivileged user create a user namespace in a container
        run: bash scripts/package/verify/prepare-runner.sh
      # The metadata of the repository the proof installs from is made here, in the container the package was built in,
      # because the images the proof also runs on do not all have createrepo_c: Red Hat's UBI has neither it nor EPEL.
      # The container reads the packages and writes only the metadata, and nothing built by the compiler runs in it.
      - name: Make the repository the package manager will read, with the tool of the distribution
        run: |
          mkdir "$RUNNER_TEMP/repo"
          docker build --quiet --tag "package-$ID" "scripts/package/images/$ID"
          docker run --rm \
            -v "$RUNNER_TEMP/rpms:/rpms:ro" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" -v "$RUNNER_TEMP/repo:/repo" "package-$ID" \
            bash /scripts/package/rpm/make-repo.sh /rpms /repo
          cp -r "$RUNNER_TEMP/repo/repodata" "$RUNNER_TEMP/rpms/"
      - name: Install it with the package manager on a clean image and over the distribution's Podman, and run containers
        run: |
          pv="$(bash scripts/package/package-version.sh "$VERSION")"
          images="$ID $(bash scripts/package/distros.sh field "$ID" tests | tr ',' ' ')"
          for image in $images; do
            docker build --quiet --tag "package-test-$image" "scripts/package/images/$image"
            for mode in clean upgrade; do
              echo "::group::$image $mode"
              docker run --rm --privileged \
                -v "$RUNNER_TEMP/rpms:/rpms:ro" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" "package-test-$image" \
                bash /scripts/package/verify/rpm-test.sh /rpms "$ID" "$pv" "${PODMAN#v}" "$mode" "$TEST_IMAGE"
              echo "::endgroup::"
            done
          done
