name: Build the package (reusable)

# Fetches and verifies the upstream tags, builds the package for one
# architecture in the Debian 13 container, installs it on clean Debian 13 and
# Ubuntu 24.04 and 26.04, and checks that Ubuntu 22.04 refuses it. release.yml
# calls it for every architecture and uploads the result for signing;
# build-check.yml calls it on a pull request that changes how the package is
# built, with upload false, so a broken recipe fails before it reaches main.
#
# Third-party code runs here (a compiler, the Go toolchain, upstream sources),
# so it holds contents: read and no secrets, and the checkout keeps no
# credentials. What it hands forward is an artifact; the signing job runs the
# signing tools from a checkout of its own and executes nothing this job built
# or checked out.

on:
  workflow_call:
    inputs:
      arch:
        description: Package architecture, amd64 or arm64
        type: string
        required: true
      runner:
        description: Runner label that matches the architecture
        type: string
        required: true
      version:
        description: Package version, the release tag without the leading v
        type: string
        required: true
      podman:
        description: Upstream Podman tag
        type: string
        required: true
      netavark:
        description: Upstream netavark tag
        type: string
        required: true
      aardvark:
        description: Upstream aardvark-dns tag
        type: string
        required: true
      podman_sha:
        description: Commit the Podman tag pointed at when the plan ran
        type: string
        required: true
      netavark_sha:
        description: Commit the netavark tag pointed at when the plan ran
        type: string
        required: true
      aardvark_sha:
        description: Commit the aardvark-dns tag pointed at when the plan ran
        type: string
        required: true
      upload:
        description: Upload the package as the artifact deb-<arch>
        type: boolean
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    # Measured on 2026-11-21 with the rootless test included: 11 min 42 s on
    # amd64 and 11 min 4 s on arm64. Three times that, so a slow runner is not a
    # red and a hang does not hold the release group for six hours.
    timeout-minutes: 35
    env:
      ARCH: ${{ inputs.arch }}
      VERSION: ${{ inputs.version }}
      PODMAN: ${{ inputs.podman }}
      NETAVARK: ${{ inputs.netavark }}
      AARDVARK: ${{ inputs.aardvark }}
      PODMAN_SHA: ${{ inputs.podman_sha }}
      NETAVARK_SHA: ${{ inputs.netavark_sha }}
      AARDVARK_SHA: ${{ inputs.aardvark_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the upstream tags and verify their signatures
        run: |
          fetch() { # <directory> <repository> <tag> <commit the plan resolved>
            git clone --quiet --branch "$3" "https://github.com/containers/$2.git" "$RUNNER_TEMP/$1"
            commit="$(bash scripts/upstream/verify-tag.sh "$RUNNER_TEMP/$1" "$3")"
            [ "$(git -C "$RUNNER_TEMP/$1" rev-parse HEAD)" = "$commit" ]
            # Both architectures check out the commit the plan saw, so an upstream
            # tag moved in between cannot give them different sources.
            [ "$commit" = "$4" ] || { echo "$2 $3 is at $commit, the plan saw $4" >&2; exit 1; }
            echo "verified $2 $3 at $commit"
          }
          fetch podman podman "$PODMAN" "$PODMAN_SHA"
          fetch netavark netavark "$NETAVARK" "$NETAVARK_SHA"
          fetch aardvark aardvark-dns "$AARDVARK" "$AARDVARK_SHA"
      - name: Build the package
        run: |
          docker build --quiet --target build -t podman-deb-build scripts/build
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$RUNNER_TEMP/podman:/src/podman" -v "$RUNNER_TEMP/netavark:/src/netavark" \
            -v "$RUNNER_TEMP/aardvark:/src/aardvark" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            -v "$RUNNER_TEMP/out:/out" podman-deb-build \
            bash /scripts/build/build-deb.sh /src/podman /src/netavark /src/aardvark "$VERSION" /out
      - name: Smoke-test the package on Debian 13 and Ubuntu 24.04 and 26.04
        run: |
          for target in base ubuntu2404 ubuntu2604; do
            docker build --quiet --target "$target" -t "podman-deb-$target" scripts/build
            docker run --rm --privileged \
              -v "$RUNNER_TEMP/out:/out:ro" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" "podman-deb-$target" \
              bash /scripts/verify/smoke-test.sh "/out/podman_${VERSION}_${ARCH}.deb" "${PODMAN#v}"
            docker run --rm --privileged \
              -v "$RUNNER_TEMP/out:/out:ro" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" "podman-deb-$target" \
              bash /scripts/verify/smoke-test.sh "/out/podman_${VERSION}_${ARCH}.deb" "${PODMAN#v}" clean
          done
      - name: Check an older release refuses the package
        run: |
          docker build --quiet --target ubuntu2204 -t podman-deb-ubuntu2204 scripts/build
          docker run --rm \
            -v "$RUNNER_TEMP/out:/out:ro" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" podman-deb-ubuntu2204 \
            bash /scripts/verify/refuse-test.sh "/out/podman_${VERSION}_${ARCH}.deb"
      # Last, because it replaces the Podman of the runner itself. The containers above
      # cannot run a rootless container (an unprivileged user in them cannot map ids), and
      # the runner can: it is an Ubuntu 24.04 machine with its own kernel and AppArmor.
      - name: Run a rootless container on pasta, on the runner itself
        run: |
          cp "$RUNNER_TEMP/out/podman_${VERSION}_${ARCH}.deb" "$RUNNER_TEMP/podman-under-test.deb"
          bash scripts/verify/rootless-test.sh "$RUNNER_TEMP/podman-under-test.deb" "${PODMAN#v}"
      - if: ${{ inputs.upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ inputs.arch }}
          path: ${{ runner.temp }}/out/*.deb
          retention-days: 1
          if-no-files-found: error
