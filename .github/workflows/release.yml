name: release

# Packages the newest stable upstream Podman, with the netavark and aardvark-dns
# it needs, as a signed .deb, with no human step. Every few hours it asks
# upstream for the newest stable tag of each of the three; if they differ from
# the latest release it verifies the tags, builds on Debian 13, smoke-tests the
# package, signs it and publishes it. The apt repository
# picks the release up on its next daily run. Any failed step stops the run
# before anything is published, so the previous release stays the latest.

on:
  schedule:
    - cron: "17 */6 * * *"
  # A change to how the package is built does not wait for the next tick: the plan
  # notices the new recipe and builds. A change to the keys that verify upstream,
  # or to this workflow, runs the plan too, which only builds if something is
  # missing; it is how a release that was refused for a missing key retries at
  # once, and how an edit to this file is exercised the moment it lands.
  push:
    branches: [main]
    paths:
      - "scripts/build/**"
      - "keyring/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    # Only main publishes. A dispatch from a branch would otherwise tag an
    # unreviewed commit as the release apt serves.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      version: ${{ steps.p.outputs.version }}
      build: ${{ steps.p.outputs.build }}
      podman: ${{ steps.p.outputs.podman }}
      netavark: ${{ steps.p.outputs.netavark }}
      aardvark: ${{ steps.p.outputs.aardvark }}
      recipe: ${{ steps.p.outputs.recipe }}
      podman_sha: ${{ steps.p.outputs.podman_sha }}
      netavark_sha: ${{ steps.p.outputs.netavark_sha }}
      aardvark_sha: ${{ steps.p.outputs.aardvark_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether a new release is needed
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          w="$RUNNER_TEMP/plan"; mkdir -p "$w"
          for c in podman netavark aardvark-dns; do
            echo "$c $(scripts/upstream/latest-stable.sh "https://github.com/containers/$c.git")" >> "$w/fresh"
          done
          # How the package is built counts as a component: upstream tags cannot
          # see a packaging fix, so without this one never produces a release.
          echo "recipe $(scripts/build/recipe-id.sh)" >> "$w/fresh"
          # Every tag the repository has, from git rather than from the release
          # list: a tag can exist without a release, and a window of the newest
          # releases would one day miss the revision the planner has to step past.
          git ls-remote --tags "https://github.com/$GH_REPO.git" \
            | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u > "$w/tags"
          scripts/upstream/read-released.sh "$w/released"
          scripts/upstream/plan-release.sh "$w/fresh" "$w/released" "$w/tags" >> "$GITHUB_OUTPUT"
          # The package version is the tag without its leading v; the build
          # workflow takes it as given, since an expression cannot strip it.
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT")"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          for c in podman netavark aardvark-dns; do
            echo "${c%-dns}=$(awk -v c="$c" '$1 == c {print $2}' "$w/fresh")" >> "$GITHUB_OUTPUT"
          done
          echo "recipe=$(awk '$1 == "recipe" {print $2}' "$w/fresh")" >> "$GITHUB_OUTPUT"
          # The commit each tag points at right now, fixed here so both build
          # jobs check out exactly this and an upstream tag moved in between
          # cannot give the two architectures different sources.
          for c in podman netavark aardvark-dns; do
            tag="$(awk -v c="$c" '$1 == c {print $2}' "$w/fresh")"
            sha="$(git ls-remote "https://github.com/containers/$c.git" "refs/tags/$tag^{}" | awk '{print $1}')"
            [ -n "$sha" ] || { echo "$c $tag is not an annotated tag upstream" >&2; exit 1; }
            echo "${c%-dns}_sha=$sha" >> "$GITHUB_OUTPUT"
          done
          cat "$w/fresh"

  # The build itself lives in reusable-build.yml so that build-check.yml can run
  # the same steps on a pull request. Third-party code runs there, with
  # contents: read and no secrets; what it hands forward is the artifact
  # deb-<arch>, and the signing job never executes anything from it.
  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    uses: ./.github/workflows/reusable-build.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      version: ${{ needs.plan.outputs.version }}
      podman: ${{ needs.plan.outputs.podman }}
      netavark: ${{ needs.plan.outputs.netavark }}
      aardvark: ${{ needs.plan.outputs.aardvark }}
      podman_sha: ${{ needs.plan.outputs.podman_sha }}
      netavark_sha: ${{ needs.plan.outputs.netavark_sha }}
      aardvark_sha: ${{ needs.plan.outputs.aardvark_sha }}
      upload: true

  publish:
    name: Sign and publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 15
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PODMAN: ${{ needs.plan.outputs.podman }}
      NETAVARK: ${{ needs.plan.outputs.netavark }}
      AARDVARK: ${{ needs.plan.outputs.aardvark }}
      RECIPE: ${{ needs.plan.outputs.recipe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - name: Sign every package, then verify against the published key
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
          PYTHONUTF8: "1"
        run: |
          if [ -z "$GLYNDOR_RELEASE_ED25519_KEY" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY is not configured; refusing to publish unsigned packages."
            exit 1
          fi
          [ "$(find . -maxdepth 1 -name 'podman_*.deb' | wc -l)" -eq 2 ] || { echo "::error::expected one package per architecture"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/signvenv"
          py="$RUNNER_TEMP/signvenv/bin/python"
          "$py" -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"
          for deb in podman_*.deb; do
            "$py" "$GITHUB_WORKSPACE/.github/scripts/release/sign.py" "$deb"
            "$py" "$GITHUB_WORKSPACE/.github/scripts/release/verify-sig.py" "$deb" "$deb.sig" "$GITHUB_WORKSPACE/keyring/glyndor-release-ed25519.b64"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/artifacts/podman_*.deb
      - name: Create the release
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'podman %s\nnetavark %s\naardvark-dns %s\nrecipe %s\n' "$PODMAN" "$NETAVARK" "$AARDVARK" "$RECIPE" > components.txt
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Podman ${TAG#v}" \
            --notes "Podman $PODMAN with netavark $NETAVARK and aardvark-dns $AARDVARK, each built from its upstream tag on Debian 13. The tag signatures were verified against the keys in containers/release-keys, and each package was installed and run before signing." \
            podman_*.deb podman_*.deb.sig components.txt
