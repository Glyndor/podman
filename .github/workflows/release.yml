name: release

# Packages the newest stable upstream Podman as a signed .deb, with no human
# step. Every few hours it asks upstream for its newest stable tag; if this
# repository has no release for it yet, it verifies the tag, builds on Debian
# 13, smoke-tests the package, signs it and publishes it. The apt repository
# picks the release up on its next daily run. Any failed step stops the run
# before anything is published, so the previous release stays the latest.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to package (default: newest stable)"
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      build: ${{ steps.p.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether a new release is needed
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(scripts/upstream/latest-stable.sh)}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag: $tag"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then build=false; else build=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "upstream $tag, build needed: $build"

  # This job installs a compiler and fetches the Go toolchain: third-party code
  # runs here, so it holds contents: read and no secrets. What it hands forward
  # is an artifact; the signing job never executes anything from this workspace.
  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # Estimate, not yet measured on a runner: a local amd64 build of 6.2.0 took
    # a few minutes. Tighten after the first scheduled runs.
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the upstream tag and verify its signature
        run: |
          git clone --quiet --branch "$TAG" https://github.com/containers/podman.git "$RUNNER_TEMP/src"
          commit="$(scripts/upstream/verify-tag.sh "$RUNNER_TEMP/src" "$TAG")"
          [ "$(git -C "$RUNNER_TEMP/src" rev-parse HEAD)" = "$commit" ]
          echo "verified $TAG at $commit"
      - name: Build the package
        run: |
          docker build --quiet --target build -t podman-deb-build scripts/build
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            -v "$RUNNER_TEMP/src:/src" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            -v "$RUNNER_TEMP/out:/out" podman-deb-build \
            bash /scripts/build/build-deb.sh /src "${TAG#v}" /out
      - name: Smoke-test the package on a clean Debian 13
        run: |
          docker build --quiet --target base -t podman-deb-base scripts/build
          docker run --rm --privileged \
            -v "$RUNNER_TEMP/out:/out:ro" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" podman-deb-base \
            bash /scripts/verify/smoke-test.sh "/out/podman_${TAG#v}_${{ matrix.arch }}.deb" "${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*.deb
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 15
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - name: Sign every package, then verify against the published key
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
          PYTHONUTF8: "1"
        run: |
          if [ -z "$GLYNDOR_RELEASE_ED25519_KEY" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY is not configured; refusing to publish unsigned packages."
            exit 1
          fi
          [ "$(find . -maxdepth 1 -name 'podman_*.deb' | wc -l)" -eq 2 ] || { echo "::error::expected one package per architecture"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/signvenv"
          py="$RUNNER_TEMP/signvenv/bin/python"
          "$py" -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"
          for deb in podman_*.deb; do
            "$py" "$GITHUB_WORKSPACE/.github/scripts/release/sign.py" "$deb"
            "$py" "$GITHUB_WORKSPACE/.github/scripts/release/verify-sig.py" "$deb" "$deb.sig" "$GITHUB_WORKSPACE/keyring/glyndor-release-ed25519.b64"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/artifacts/podman_*.deb
      - name: Create the release
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Podman ${TAG#v}" \
            --notes "Podman ${TAG#v}, built from the upstream tag $TAG on Debian 13. The tag signature was verified against the keys in containers/release-keys, and each package was installed and run before signing." \
            podman_*.deb podman_*.deb.sig
