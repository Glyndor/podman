name: release

# Packages the newest stable upstream Podman, with the netavark and aardvark-dns
# it needs, as a signed .deb, with no human step. Every few hours it asks
# upstream for the newest stable tag of each of the three; if they differ from
# the latest release it verifies the tags, builds on Debian 13, smoke-tests the
# package, signs it and publishes it. The apt repository
# picks the release up on its next daily run. Any failed step stops the run
# before anything is published, so the previous release stays the latest.

on:
  schedule:
    - cron: "17 */6 * * *"
  # A change to how the package is built does not wait for the next tick: the plan
  # notices the new recipe and builds. A change to the keys that verify upstream,
  # or to this workflow, runs the plan too, which only builds if something is
  # missing; it is how a release that was refused for a missing key retries at
  # once, and how an edit to this file is exercised the moment it lands.
  push:
    branches: [main]
    paths:
      - "scripts/build/**"
      - "keyring/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/reusable-build.yml"
  # A rehearsal: dry_run runs the whole path, from the plan to the check of the signed set, with a
  # throwaway key made for the run, and neither reads the signing secrets nor attests nor creates a
  # release. It builds even when nothing is new, under a version no release can have.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse: build and sign with a throwaway key, publish nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# Every run step goes through `bash -e -o pipefail`, which is what `shell: bash` means to Actions. Without it
# the shell is `bash -e` alone, and a pipeline hides the failure of all but its last command.
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    # Only main publishes. A dispatch from a branch would otherwise tag an
    # unreviewed commit as the release apt serves.
    if: github.ref == 'refs/heads/main'
    # ubuntu-latest resolved to ubuntu-26.04 in this repository's runs on 2026-11-20,
    # and ubuntu-24.04-arm to 24.04. The label is named so a change of image is a
    # commit; the arm64 build keeps its own label, so the rootless test covers both.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Measured in this repository's runs: 6 to 8 seconds, with the six ls-remote calls
    # to upstream. The ten minutes is a ceiling, and it matters: this job holds the
    # release group, so a hang here holds every later run behind it.
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      version: ${{ steps.p.outputs.version }}
      build: ${{ steps.p.outputs.build }}
      podman: ${{ steps.p.outputs.podman }}
      netavark: ${{ steps.p.outputs.netavark }}
      aardvark: ${{ steps.p.outputs.aardvark }}
      recipe: ${{ steps.p.outputs.recipe }}
      podman_sha: ${{ steps.p.outputs.podman_sha }}
      netavark_sha: ${{ steps.p.outputs.netavark_sha }}
      aardvark_sha: ${{ steps.p.outputs.aardvark_sha }}
      previous_mldsa: ${{ steps.p.outputs.previous_mldsa }}
      sha: ${{ steps.p.outputs.sha }}
      dry_run: ${{ steps.p.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether a new release is needed
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          w="$RUNNER_TEMP/plan"; mkdir -p "$w"
          # The commit every later job of this run signs and tags: the one this job checked
          # out, which is the one the event named. The build jobs check out the commit of
          # the event, which is the same for the whole run, and the jobs that sign and
          # publish check out this one by its id; nothing resolves a branch or a tag again,
          # so a ref that moves during the run cannot change what is signed.
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "the checkout is at '$sha', which is not a full commit id" >&2; exit 1; }
          [ "$sha" = "$GITHUB_SHA" ] || { echo "the checkout is at $sha, not at $GITHUB_SHA" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          for c in podman netavark aardvark-dns; do
            echo "$c $(bash scripts/upstream/latest-stable.sh "https://github.com/containers/$c.git")" >> "$w/fresh"
          done
          # How the package is built counts as a component: upstream tags cannot
          # see a packaging fix, so without this one never produces a release.
          echo "recipe $(bash scripts/build/recipe-id.sh)" >> "$w/fresh"
          # Every tag the repository has, from git rather than from the release
          # list: a tag can exist without a release, and a window of the newest
          # releases would one day miss the revision the planner has to step past.
          git ls-remote --tags "https://github.com/$GH_REPO.git" \
            | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u > "$w/tags"
          latest="$(bash scripts/upstream/read-released.sh "$w/released")"
          bash scripts/upstream/plan-release.sh "$w/fresh" "$w/released" "$w/tags" > "$w/plan"
          # A rehearsal builds whether or not something is new, under a version that no release has
          # or will have: it is never published, and a name that cannot be a revision keeps it apart.
          [ "${DRY_RUN:-}" != true ] || grep -q -x build=true "$w/plan" || printf 'build=true\ntag=%s+r999\n' "$(awk '$1 == "podman" {print $2}' "$w/fresh")" > "$w/plan"
          cat "$w/plan" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          # Whether the newest release carries the second signature, which the signing
          # step reads as an alarm (see there). Asked only when this run builds: most
          # runs build nothing, and an asset list that could not be read would turn
          # each of them red and open an issue over an answer nobody uses. When it
          # builds, a list that cannot be read stops the run. It is the release read
          # above, so it is not looked up nor its components.txt downloaded again.
          if [ "$(sed -n 's/^build=//p' "$GITHUB_OUTPUT")" = true ]; then
            bash scripts/upstream/read-released.sh --assets "$latest" "$w/assets"
            previous_mldsa=false
            if grep -q '\.mldsa65\.sig$' "$w/assets"; then previous_mldsa=true; fi
            echo "previous_mldsa=$previous_mldsa" >> "$GITHUB_OUTPUT"
          fi
          # The package version is the tag without its leading v; the build
          # workflow takes it as given, since an expression cannot strip it.
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT")"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          for c in podman netavark aardvark-dns; do
            echo "${c%-dns}=$(awk -v c="$c" '$1 == c {print $2}' "$w/fresh")" >> "$GITHUB_OUTPUT"
          done
          echo "recipe=$(awk '$1 == "recipe" {print $2}' "$w/fresh")" >> "$GITHUB_OUTPUT"
          # The commit each tag points at right now, fixed here so both build
          # jobs check out exactly this and an upstream tag moved in between
          # cannot give the two architectures different sources.
          for c in podman netavark aardvark-dns; do
            tag="$(awk -v c="$c" '$1 == c {print $2}' "$w/fresh")"
            sha="$(git ls-remote "https://github.com/containers/$c.git" "refs/tags/$tag^{}" | awk '{print $1}')"
            [ -n "$sha" ] || { echo "$c $tag is not an annotated tag upstream" >&2; exit 1; }
            echo "${c%-dns}_sha=$sha" >> "$GITHUB_OUTPUT"
          done
          cat "$w/fresh"

  # The build itself lives in reusable-build.yml so that build-check.yml can run
  # the same steps on a pull request. Third-party code runs there, with
  # contents: read and no secrets; what it hands forward is the artifact
  # deb-<arch> and, as outputs of the job, its id, its digest and the sha256 of the
  # package, taken before anything ran it. There is one call for each architecture
  # and no matrix, because the outputs of the legs of a matrix overwrite each other.
  # The signing job never executes anything from the build.
  build-amd64:
    name: Build amd64
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build.yml
    with:
      arch: amd64
      runner: ubuntu-26.04
      version: ${{ needs.plan.outputs.version }}
      podman: ${{ needs.plan.outputs.podman }}
      netavark: ${{ needs.plan.outputs.netavark }}
      aardvark: ${{ needs.plan.outputs.aardvark }}
      podman_sha: ${{ needs.plan.outputs.podman_sha }}
      netavark_sha: ${{ needs.plan.outputs.netavark_sha }}
      aardvark_sha: ${{ needs.plan.outputs.aardvark_sha }}
      upload: true

  build-arm64:
    name: Build arm64
    needs: [plan]
    if: ${{ needs.plan.outputs.build == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build.yml
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
      version: ${{ needs.plan.outputs.version }}
      podman: ${{ needs.plan.outputs.podman }}
      netavark: ${{ needs.plan.outputs.netavark }}
      aardvark: ${{ needs.plan.outputs.aardvark }}
      podman_sha: ${{ needs.plan.outputs.podman_sha }}
      netavark_sha: ${{ needs.plan.outputs.netavark_sha }}
      aardvark_sha: ${{ needs.plan.outputs.aardvark_sha }}
      upload: ${{ true }}

  # The job that holds the signing keys. It signs what the build jobs made and nothing else,
  # and it can do nothing but sign: no write permission on the repository, no token for
  # attestations. What it signs is checked against the exact list of names the verified
  # tag implies before the first key is read, and the tools it runs come from a checkout of
  # the commit the plan fixed, with Python isolated (-I) and never started in a directory
  # that holds a download.
  sign:
    name: Sign
    needs: [plan, build-amd64, build-arm64]
    # The environment whose policy releases the keys to this job. It admits the branch main only, which
    # GitHub decides outside this file: a branch that edits the `if:` below to run the job is refused the
    # deployment and gets no secret. The keys are still secrets of the organization until their owner
    # moves them into this environment; the declaration is already in place, and the test of the contract
    # fails for any job that names a secret without it. The guard below is a courtesy.
    environment: release
    # The same guard as plan, on the job that holds the signing keys: a skipped plan already
    # skips this one, and a later edit that makes this job run whatever its needs did (an
    # always() above it) would otherwise sign on a branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # To list the artifacts of this run, which is what names the ones to take.
      actions: read
    # Ceiling, not measured: a download of two packages and their signing.
    timeout-minutes: 15
    outputs:
      require_mldsa: ${{ steps.sign.outputs.require_mldsa }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS_MLDSA: ${{ needs.plan.outputs.previous_mldsa }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # The packages are taken by the id each build job reported when it uploaded its artifact, and
      # nothing is looked up by name here: the name can be taken by any step that ran after the build.
      # The list of this run has to show that same id with the digest the build job reported, made for
      # the commit the plan fixed and not expired; the download fails when what it unpacked is not
      # the digest GitHub recorded; and the package inside has to be the one whose sha256 the build
      # job took before anything ran it. Nothing here holds a secret.
      - name: Check the artifact of each package is the one the build uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ needs.plan.outputs.sha }}
          AMD64_ID: ${{ needs.build-amd64.outputs.artifact_id }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.artifact_digest }}
          ARM64_ID: ${{ needs.build-arm64.outputs.artifact_id }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.artifact_digest }}
        run: |
          list="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | [.name, (.id | tostring), (.expired | tostring), .workflow_run.head_sha, (.digest // "")] | @tsv')"
          for arch in amd64 arm64; do
            id_name="${arch^^}_ID"; digest_name="${arch^^}_DIGEST"
            want_id="${!id_name}"; want_digest="${!digest_name}"
            [[ "$want_id" =~ ^[0-9]+$ ]] || { echo "::error::the build of $arch reported the artifact id '$want_id', not a number; refusing to sign."; exit 1; }
            want_digest="${want_digest#sha256:}"
            [[ "$want_digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the build of $arch reported the digest '$want_digest', not a sha256; refusing to sign."; exit 1; }
            rows="$(printf '%s\n' "$list" | awk -F'\t' -v id="$want_id" '$2 == id')"
            [ "$(printf '%s\n' "$rows" | grep -c .)" = 1 ] \
              || { echo "::error::this run does not list exactly one artifact with the id $want_id that the build of $arch reported; refusing to sign."; exit 1; }
            IFS=$'\t' read -r name _ expired head digest <<< "$rows"
            [ "$name" = "deb-$arch" ] || { echo "::error::the artifact $want_id is called $name, not deb-$arch; refusing to sign."; exit 1; }
            [ "$expired" = false ] || { echo "::error::the artifact deb-$arch has expired; refusing to sign."; exit 1; }
            [ "$head" = "$SHA" ] || { echo "::error::the artifact deb-$arch was made for $head, not for $SHA; refusing to sign."; exit 1; }
            [ "${digest#sha256:}" = "$want_digest" ] || { echo "::error::the list of this run gives deb-$arch the digest '$digest', and the build reported sha256:$want_digest; refusing to sign."; exit 1; }
            echo "deb-$arch is artifact $want_id, sha256:$want_digest"
          done
      # One artifact at a time, by its id, into a directory that did not exist and is not under the
      # checkout. The download fails when what it unpacked is not the digest recorded for the id.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-amd64.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/built/deb-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-arm64.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/built/deb-arm64
      - name: Check each package is the file the build hashed before it ran
        env:
          AMD64_SHA256: ${{ needs.build-amd64.outputs.sha256 }}
          ARM64_SHA256: ${{ needs.build-arm64.outputs.sha256 }}
        run: |
          version="${TAG#v}"
          for arch in amd64 arm64; do
            hash_name="${arch^^}_SHA256"; want="${!hash_name}"
            [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the build of $arch reported the sha256 '$want', not a sha256; refusing to sign."; exit 1; }
            file="$RUNNER_TEMP/built/deb-$arch/podman_${version}_${arch}.deb"
            [ "$(stat -c %F "$file" 2> /dev/null)" = "regular file" ] \
              || { echo "::error::$file is not a regular file; refusing to sign."; exit 1; }
            got="$(sha256sum "$file" | cut -d' ' -f1)"
            [ "$got" = "$want" ] || { echo "::error::podman_${version}_${arch}.deb is $got, and the build hashed $want before it ran; refusing to sign."; exit 1; }
          done
      # No secret is in the environment of the next two steps. The first is the only reader of
      # the download; what it lets through is copied to a directory of its own, as regular files
      # whose names and control fields are the ones the tag implies. The second makes the
      # virtual environment of the signing library, by hash and binary only, from an empty
      # directory of its own, so nothing a package carried can be imported by it.
      - name: Check what was built is exactly the packages of the tag
        run: bash scripts/release/check-artifacts.sh built "$TAG" "$RUNNER_TEMP/built" "$RUNNER_TEMP/stage"
      - name: Install the signing library
        run: |
          mkdir "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          python3 -I -m venv "$RUNNER_TEMP/signvenv"
          "$RUNNER_TEMP/signvenv/bin/python" -I -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"
      - name: Sign every package, then verify against the published key
        id: sign
        working-directory: ${{ runner.temp }}/tools
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ needs.plan.outputs.dry_run != 'true' && secrets.GLYNDOR_RELEASE_ED25519_KEY || '' }}
          # The second, post-quantum key. A secret that is not configured
          # arrives as an empty string, which sign.py reads as unset: the
          # packages are then signed with Ed25519 alone, as before it existed.
          GLYNDOR_RELEASE_MLDSA65_KEY: ${{ needs.plan.outputs.dry_run != 'true' && secrets.GLYNDOR_RELEASE_MLDSA65_KEY || '' }}
          PYTHONUTF8: "1"
        run: |
          # A rehearsal does not read the secrets at all: the expressions of the two keys give this step
          # an empty string, and the rehearsal makes throwaway keys of its own below.
          if [ "${DRY_RUN:-}" != true ] && [ -z "$GLYNDOR_RELEASE_ED25519_KEY" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY is not configured; refusing to publish unsigned packages."
            exit 1
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+r[0-9]+)?$ ]] || { echo "::error::the tag '$TAG' is not a version; refusing to sign."; exit 1; }
          version="${TAG#v}"
          stage="$RUNNER_TEMP/stage"
          py="$RUNNER_TEMP/signvenv/bin/python"
          # Three things require the second signature, and any one of them is enough:
          # - keyring/second-signature-required holds the line "required". That is the
          #   switch. It is committed, so turning it on or off is a change of its own
          #   in a reviewed pull request, and while it is on, an anchor with no key, a
          #   missing secret, or a second signature that is missing or does not verify
          #   stops the run.
          # - keyring/glyndor-release-mldsa65.b64 holds a public key: every package then
          #   leaves with an ML-DSA-65 signature that verifies against it, and a secret
          #   that was lost, renamed or never set stops the run.
          # - the secret is set: a signature nobody can check is refused, so the key has
          #   to be committed too.
          # With none of them, the check is the Ed25519 one the release always had. Set
          # the secret and merge the key one after the other: a release built between
          # the two stops, whichever came first.
          #
          # One more check is an alarm, not a switch: the newest release carries an
          # ML-DSA-65 signature and the anchor holds no key. It reads only the newest
          # release, so a release published without the signature, or the deletion of
          # the one that had it, silences it. The switch above does not move with them.
          case "$PREVIOUS_MLDSA" in
            true | false) ;;
            *) echo "::error::the plan did not say whether the newest release carries the second signature ('$PREVIOUS_MLDSA'); refusing to guess."; exit 1 ;;
          esac
          ed25519="$GITHUB_WORKSPACE/keyring/glyndor-release-ed25519.b64"
          anchor="$GITHUB_WORKSPACE/keyring/glyndor-release-mldsa65.b64"
          switch="$GITHUB_WORKSPACE/keyring/second-signature-required"
          for f in "$ed25519" "$anchor" "$switch"; do
            [ -f "$f" ] || { echo "::error::$f is missing; refusing to publish without the keys and the switch it reads."; exit 1; }
          done
          # Every file of keyring/ this run reads is read by more than one reader, and
          # they split lines differently: this step and docs/verify.md on the line feed,
          # the apt archive with read, verify-sig.py on every line break Python knows.
          # A key behind a carriage return or a U+0085 would be part of a comment to
          # one and a key to another: here, a second signature nobody required, and for
          # the Ed25519 anchor, a key verify-sig.py trusts and the published procedure
          # never sees. So the three are printable ASCII with line feeds, or the run
          # stops. The bytes are counted, not matched line by line: GNU grep reads a
          # file with a NUL in it as binary and reports no match.
          for f in "$ed25519" "$anchor" "$switch"; do
            outside="$(LC_ALL=C tr -d ' -~\n' < "$f" | wc -c)"
            if [ "$outside" -ne 0 ]; then
              echo "::error::${f#"$GITHUB_WORKSPACE"/} holds a byte that is neither printable ASCII nor a line feed; refusing to guess what it says."
              exit 1
            fi
          done
          # A line of the switch is a comment, blank, or exactly "required". Anything
          # else stops the run: a switch that was not understood is not read as off.
          switched=false
          while IFS= read -r line || [ -n "$line" ]; do
            if [ "$line" = required ]; then
              switched=true
            elif ! [[ "$line" =~ ^[[:space:]]*(#.*)?$ ]]; then
              echo "::error::keyring/second-signature-required holds the line '$line', which is neither a comment nor 'required'; refusing to guess whether the second signature is required."
              exit 1
            fi
          done < "$switch"
          anchored=false
          if grep -q -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' "$anchor"; then anchored=true; fi
          # A rehearsal signs what a release would sign, with keys made for this run and anchors that hold
          # only their public halves, in the places where the real ones are read. It makes a second key
          # exactly when the real anchor holds one, so the path it takes is the real configuration's.
          # The seeds stay in this step: the files with them are not uploaded, and the public halves are.
          if [ "${DRY_RUN:-}" = true ]; then
            dry="$RUNNER_TEMP/dry"
            dry_args=(); [ "$anchored" != true ] || dry_args=(--mldsa)
            "$py" -I "$GITHUB_WORKSPACE/.github/scripts/release/dry-run-keys.py" "$dry" "${dry_args[@]}"
            read -r GLYNDOR_RELEASE_ED25519_KEY < "$dry/ed25519.seed"
            ed25519="$dry/ed25519.b64"
            if [ "$anchored" = true ]; then
              read -r GLYNDOR_RELEASE_MLDSA65_KEY < "$dry/mldsa65.seed"
              anchor="$dry/mldsa65.b64"
            fi
            mkdir "$RUNNER_TEMP/dry-public"
            cp "$dry"/*.b64 "$RUNNER_TEMP/dry-public/"
          fi
          if [ "$switched" = true ] && [ "$anchored" = false ]; then
            echo "::error::keyring/second-signature-required requires the second signature and keyring/glyndor-release-mldsa65.b64 holds no key; refusing to publish with Ed25519 alone."
            exit 1
          fi
          if [ "$PREVIOUS_MLDSA" = true ] && [ "$anchored" = false ]; then
            echo "::error::the newest release carries an ML-DSA-65 signature and keyring/glyndor-release-mldsa65.b64 holds no key; refusing to publish this one with Ed25519 alone. This reads only the newest release; what requires the second signature for good is the line 'required' in keyring/second-signature-required."
            exit 1
          fi
          if [ "$anchored" = true ] && [ -z "$GLYNDOR_RELEASE_MLDSA65_KEY" ]; then
            echo "::error::keyring/glyndor-release-mldsa65.b64 holds a public key and GLYNDOR_RELEASE_MLDSA65_KEY is not configured; refusing to publish with one signature."
            exit 1
          fi
          required=false
          require=()
          if [ -n "$GLYNDOR_RELEASE_MLDSA65_KEY" ] || [ "$PREVIOUS_MLDSA" = true ] || [ "$switched" = true ]; then
            required=true
            require=(--require-mldsa)
          fi
          for arch in amd64 arm64; do
            deb="$stage/podman_${version}_${arch}.deb"
            "$py" -I "$GITHUB_WORKSPACE/.github/scripts/release/sign.py" "$deb"
            "$py" -I "$GITHUB_WORKSPACE/.github/scripts/release/verify-sig.py" "$deb" "$deb.sig" "$ed25519" \
              --mldsa-sig "$deb.mldsa65.sig" --mldsa-keys "$anchor" "${require[@]}"
          done
          echo "require_mldsa=$required" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: ${{ runner.temp }}/stage/
          retention-days: 1
          if-no-files-found: error
      # The public halves of the throwaway keys, for the rehearsal's own check of the signatures.
      - if: ${{ needs.plan.outputs.dry_run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-anchors
          path: ${{ runner.temp }}/dry-public/
          retention-days: 1
          if-no-files-found: error

  # The release that is published ships /etc/containers/policy.json as a plain file of the package, which the new
  # package does not, so dpkg removes it on the upgrade: what an administrator edited has to come back, and dpkg
  # must ask nothing. This runs the published package, so it runs on a machine of its own, after the build and
  # before publish, and nothing it starts shares a runner with the job that builds what is signed. The published
  # package is checked against the release key before any container starts, the containers are not privileged
  # (they only install packages and read files), and the copy of the new package that they see is read only.
  config-upgrade:
    name: Upgrade from the published release
    needs: [build-amd64, build-arm64, plan]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Ceiling, not measured: three container images, an apt update and two installs in each.
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-amd64
          path: ${{ runner.temp }}/new
      - name: Fetch the newest published release and verify it against the release key
        run: |
          # Releases that are drafts or pre-releases are not what a host has installed.
          tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then echo "no release to upgrade from"; echo "published=" > "$RUNNER_TEMP/published.env"; exit 0; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+r[0-9]+)?$ ]] || { echo "::error::the newest release is called '$tag', which is not a version"; exit 1; }
          version="${tag#v}"
          deb="podman_${version}_amd64.deb"
          mkdir "$RUNNER_TEMP/published"
          gh release download "$tag" --pattern "$deb" --pattern "$deb.sig" --dir "$RUNNER_TEMP/published"
          # A second signature is required whenever the anchor in the repository holds a key for it, so that
          # dropping the file from a release cannot make a package pass with one signature.
          anchor="$GITHUB_WORKSPACE/keyring/glyndor-release-mldsa65.b64"
          args=("$RUNNER_TEMP/published/$deb" "$RUNNER_TEMP/published/$deb.sig" "$GITHUB_WORKSPACE/keyring/glyndor-release-ed25519.b64")
          if grep -qvE '^[[:space:]]*(#|$)' "$anchor" 2> /dev/null; then
            gh release download "$tag" --pattern "$deb.mldsa65.sig" --dir "$RUNNER_TEMP/published"
            args+=(--mldsa-sig "$RUNNER_TEMP/published/$deb.mldsa65.sig" --mldsa-keys "$anchor" --require-mldsa)
          fi
          [ "$(find "$RUNNER_TEMP/published" -type f -name "$deb" | wc -l)" -eq 1 ] || { echo "::error::the release $tag does not carry exactly $deb"; exit 1; }
          python3 -I -m venv "$RUNNER_TEMP/verifyvenv"
          py="$RUNNER_TEMP/verifyvenv/bin/python"
          "$py" -I -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"
          "$py" -I "$GITHUB_WORKSPACE/.github/scripts/release/verify-sig.py" "${args[@]}"
          echo "published=$deb" > "$RUNNER_TEMP/published.env"
      - name: Upgrade from it without losing an edited policy.json
        run: |
          . "$RUNNER_TEMP/published.env"
          [ -n "$published" ] || { echo "nothing was published before: nothing to upgrade from"; exit 0; }
          for target in base ubuntu2404 ubuntu2604; do
            docker build --quiet --target "$target" -t "podman-deb-$target" scripts/build
            docker run --rm \
              -v "$RUNNER_TEMP/new:/new:ro" -v "$RUNNER_TEMP/published:/published:ro" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" "podman-deb-$target" \
              bash /scripts/verify/config-upgrade-test.sh "/published/$published" "/new/podman_${VERSION}_amd64.deb"
          done

  # The job that attests and publishes. It holds the write permissions and no signing key: it
  # takes the signed set, requires it to be exactly what the tag implies, verifies every
  # signature against the committed anchors with the same isolated Python, and only then
  # attests and creates the release, on the commit the plan fixed.
  publish:
    name: Attest and publish
    needs: [plan, sign, config-upgrade]
    # The same guard as plan, on the job that creates the release: a skipped plan already
    # skips this one, and a later edit that makes this job run whatever its needs did (an
    # always() above it) would otherwise publish from a branch. A rehearsal never gets here.
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Ceiling, not measured: a download of two packages, the attestation and the release. Like
    # the plan it holds the release group while it runs.
    timeout-minutes: 15
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      PODMAN: ${{ needs.plan.outputs.podman }}
      NETAVARK: ${{ needs.plan.outputs.netavark }}
      AARDVARK: ${{ needs.plan.outputs.aardvark }}
      RECIPE: ${{ needs.plan.outputs.recipe }}
      REQUIRE_MLDSA: ${{ needs.sign.outputs.require_mldsa }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: ${{ runner.temp }}/signed
      - name: Check the signed set is exactly the packages of the tag, with the signatures that were required
        run: bash scripts/release/check-artifacts.sh signed "$TAG" "$RUNNER_TEMP/signed" "$REQUIRE_MLDSA"
      - name: Verify every signature against the published keys
        run: |
          mkdir "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          python3 -I -m venv "$RUNNER_TEMP/verifyvenv"
          py="$RUNNER_TEMP/verifyvenv/bin/python"
          "$py" -I -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"
          version="${TAG#v}"
          require=()
          if [ "$REQUIRE_MLDSA" = true ]; then require=(--require-mldsa); fi
          for arch in amd64 arm64; do
            deb="$RUNNER_TEMP/signed/podman_${version}_${arch}.deb"
            "$py" -I "$GITHUB_WORKSPACE/.github/scripts/release/verify-sig.py" "$deb" "$deb.sig" "$GITHUB_WORKSPACE/keyring/glyndor-release-ed25519.b64" \
              --mldsa-sig "$deb.mldsa65.sig" --mldsa-keys "$GITHUB_WORKSPACE/keyring/glyndor-release-mldsa65.b64" "${require[@]}"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/signed/podman_*.deb
      - name: Create the release
        working-directory: ${{ runner.temp }}/signed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+r[0-9]+)?$ ]] || { echo "::error::the tag '$TAG' is not a version; refusing to publish."; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the commit '$SHA' is not a full commit id; refusing to publish."; exit 1; }
          version="${TAG#v}"
          printf 'podman %s\nnetavark %s\naardvark-dns %s\nrecipe %s\n' "$PODMAN" "$NETAVARK" "$AARDVARK" "$RECIPE" > "$RUNNER_TEMP/components.txt"
          # The assets are named one by one from the tag. The ML-DSA-65 signatures are published
          # whenever the signing step required them, and the check of the set already refused a
          # release in which one was missing: a release is immutable, and one without its second
          # signature cannot be completed later.
          assets=()
          for arch in amd64 arm64; do
            assets+=("podman_${version}_${arch}.deb" "podman_${version}_${arch}.deb.sig")
            if [ "$REQUIRE_MLDSA" = true ]; then assets+=("podman_${version}_${arch}.deb.mldsa65.sig"); fi
          done
          # The tag is made here, on the commit the plan fixed and on nothing else. The API refuses a
          # reference that exists, whatever commit it points at, so a tag that somebody made while the
          # build ran stops the run instead of being adopted by the release; --verify-tag then refuses to
          # make a tag of its own, which would be one on whatever the default branch is by then.
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null \
            || { echo "::error::the tag $TAG could not be created on $SHA: it exists already, or the API refused; refusing to publish."; exit 1; }
          gh release create "$TAG" --verify-tag --title "Podman ${TAG#v}" \
            --notes "Podman $PODMAN with netavark $NETAVARK and aardvark-dns $AARDVARK, each built from its upstream tag on Debian 13. The tag signatures were verified against the keys in containers/release-keys, and each package was installed and run before signing." \
            "${assets[@]}" "$RUNNER_TEMP/components.txt"

  # The end of a rehearsal, in the place of publish: it checks the signed set and every signature the
  # way publish does, against the public halves of the throwaway keys, and shows that no release was
  # made. It holds a read-only token and no secret, and what it checks was signed by the same code
  # that signs a release.
  rehearsal:
    name: Rehearsal check
    needs: [sign, plan]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.dry_run == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Ceiling, not measured: a download of two packages and their verification.
    timeout-minutes: 15
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REQUIRE_MLDSA: ${{ needs.sign.outputs.require_mldsa }}
    steps:
      # The commit of the event itself, not one a job computed: this job only needs the scripts of the
      # repository, the plan has already checked that its commit is the event's, and what it checks is
      # handed to it by artifact. Nothing here resolves a ref that an output named.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: ${{ runner.temp }}/signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dry-run-anchors
          path: ${{ runner.temp }}/dry-public
      - name: Check the signed set is exactly the packages of the tag, with the signatures that were required
        run: bash scripts/release/check-artifacts.sh signed "$TAG" "$RUNNER_TEMP/signed" "$REQUIRE_MLDSA"
      - name: Verify every signature against the throwaway keys
        run: |
          mkdir "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          python3 -I -m venv "$RUNNER_TEMP/verifyvenv"
          py="$RUNNER_TEMP/verifyvenv/bin/python"
          "$py" -I -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"
          version="${TAG#v}"
          anchor="$GITHUB_WORKSPACE/keyring/glyndor-release-mldsa65.b64"
          if [ -f "$RUNNER_TEMP/dry-public/mldsa65.b64" ]; then anchor="$RUNNER_TEMP/dry-public/mldsa65.b64"; fi
          require=()
          if [ "$REQUIRE_MLDSA" = true ]; then require=(--require-mldsa); fi
          for arch in amd64 arm64; do
            deb="$RUNNER_TEMP/signed/podman_${version}_${arch}.deb"
            "$py" -I "$GITHUB_WORKSPACE/.github/scripts/release/verify-sig.py" "$deb" "$deb.sig" "$RUNNER_TEMP/dry-public/ed25519.b64" \
              --mldsa-sig "$deb.mldsa65.sig" --mldsa-keys "$anchor" "${require[@]}"
          done
      - name: Show that no release was made
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::a release called $TAG exists after a rehearsal, which publishes none"
            exit 1
          fi
          echo "a rehearsal of $TAG: built, signed with a throwaway key and verified; nothing attested, nothing published"

  # A failed release leaves no other trace until the watchdog notices a day
  # later, so this opens the issue at once. A manual dispatch is somebody
  # watching the run, so it does not open one.
  alert:
    name: alert
    needs: [plan, build-amd64, build-arm64, sign, config-upgrade, publish, rehearsal]
    if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
    # Only calls gh or reads strings: nothing here depends on the image.
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Ceiling, not measured: two gh calls.
    timeout-minutes: 5
    steps:
      - name: Open an issue, or add to the one that is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release run failed"
          body="A release run failed. Read the run: $RUN_URL"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --label prio:P1 --label area:release --body "$body"
          fi
