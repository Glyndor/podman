version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
      - "type:ci"
    open-pull-requests-limit: 10
  - package-ecosystem: "docker"
    directory: "/scripts/build"
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
      - "type:ci"
    open-pull-requests-limit: 5
