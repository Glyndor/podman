version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
      - "type:ci"
      - "area:ci"
    open-pull-requests-limit: 10
    # One pull request for every action that moved that day: each of them reruns
    # the same checks, and several open at once only wait on each other to rebase.
    groups:
      actions:
        patterns: ["*"]
  # The library that signs and verifies a release. It is pinned by hash, so
  # nothing moves it unless something proposes the move: a fix in it would
  # otherwise wait for somebody to remember this file exists.
  - package-ecosystem: "pip"
    directory: "/.github/scripts/release"
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
      - "area:release"
    open-pull-requests-limit: 5
    groups:
      signing:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/scripts/build"
    # The Dockerfile pins each release on purpose: Debian 13 builds the package,
    # Ubuntu 24.04 and 26.04 prove it installs, and Ubuntu 22.04 proves an older
    # release refuses it. Moving any of them to a newer release would change what
    # the build and the smoke tests mean, so only the digest and patch updates
    # of the pinned release come through.
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "debian"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
      - "type:ci"
      - "area:build"
    open-pull-requests-limit: 5
